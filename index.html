  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #FAF6F0;
      --red: #D32F2F;
      --deep-crimson: #8B0000;
      --orange: #FF6B35;
      --black: #121212;
    }
    body {
      background-color: var(--cream);
      color: var(--black);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }
    .font-script {
      font-family: 'Dancing Script', cursive;
    }

    /* Deck Transition States */
    .slide-section {
      display: none;
      opacity: 0;
      transform: translateX(40px);
      filter: blur(4px);
      transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .slide-section.active {
      display: block;
      opacity: 1;
      transform: translateX(0);
      filter: blur(0);
    }
    .slide-section.exiting {
      opacity: 0;
      transform: translateX(-40px);
      filter: blur(4px);
    }

    /* Stagger reveals inside slides */
    .slide-section.active .stagger-1 { animation: fadeInUp 0.4s ease 0.05s forwards; }
    .slide-section.active .stagger-2 { animation: fadeInUp 0.4s ease 0.15s forwards; }
    .slide-section.active .stagger-3 { animation: fadeInUp 0.4s ease 0.25s forwards; }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Persistent Torn-Paper Deckle Edge at bottom */
    .torn-horizon {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>
